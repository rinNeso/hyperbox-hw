# Keep snd_hda_intel out of runtime power management.
#
# On this machine the OCuLink eGPU's HDMI-audio function (1002:ab40) failed a
# D3hot->D0 resume three times on 2026-08-27, each time taking the whole PCIe
# endpoint off the bus ("amdgpu: device lost from bus!", GPU reset -19 ENODEV),
# which is unrecoverable without a hard power cycle.
#
# power_save=10 (from /usr/lib/udev/rules.d/20-audio-pm.rules) meant the
# function suspended after 10s of silence and had to retrain the OCuLink link
# on every wake. power_save_controller=N keeps the PCI function itself in D0.
options snd_hda_intel power_save=0 power_save_controller=N
