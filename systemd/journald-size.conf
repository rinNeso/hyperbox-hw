# Shadows /usr/lib/systemd/journald.conf.d/00-journal-size.conf from
# cachyos-settings, which sets SystemMaxUse=50M -- about one day of logs on
# this machine. That is why the third-monitor incident of ~Jul/Aug 2026 had no
# surviving evidence: the journal had already rolled over twice.
#
# Root has 487G free; 1G of journal is noise.
# Installs to /etc/systemd/journald.conf.d/00-journal-size.conf (same basename,
# /etc wins over /usr/lib).
[Journal]
SystemMaxUse=1G
