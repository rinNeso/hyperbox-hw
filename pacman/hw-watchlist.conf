# hyperBox hardware watchlist
# Consulted by /usr/local/bin/hw-watchlist-check from a pacman PreTransaction hook.
# Format:  severity|package|note
#   block = stop the transaction and ask for confirmation on the terminal
#   warn  = print the note and continue
#
# This is the hardware-specific complement to cachy-update's Arch news check:
# it knows what has actually broken THIS machine (Framework Desktop / Strix Halo
# + RX 9070 XT eGPU over OCuLink, KDE Wayland).

# ---- known to have broken this machine ----
block|ddcutil|3.0.0 wedges amdgpu through PowerDevil's DDC/CI probe -> "device lost from bus" ~2s after login, three dead boots on 2026-09-13. Upstream rockowitz/ddcutil#629, fixed in 3.0.1. Pinned to 2.2.7 via IgnorePkg; only lift this once 3.0.1+ is in the repo.
block|cachyos-settings|Owns /usr/lib/udev/rules.d/20-audio-pm.rules, which is masked here by a 0-byte file in /etc/udev/rules.d. An update can reintroduce HDA runtime PM under a new filename and bring back the D3hot->D0 eGPU bus drop. After upgrading, re-check that the mask still covers every audio-PM rule it ships.
block|limine|Applies KERNEL_CMDLINE from /etc/default/limine, which carries the eGPU mitigations: amdgpu.runpm=0, pcie_port_pm=off, snd_hda_intel.power_save=0/controller=N. Verify /proc/cmdline after upgrading and re-run limine-update if needed.

# ---- display / eGPU blast radius: review before rebooting ----
warn|powerdevil|Loads libddcutil at session start. This is the process that takes the GPU down when ddcutil misbehaves.
warn|linux-cachyos|amdgpu and PCIe regressions land here. Keep the previous kernel installed until the eGPU is confirmed good on the new one.
warn|linux-cachyos-headers|Pairs with linux-cachyos.
warn|linux-firmware|Carries amdgpu microcode for Navi 48.
warn|mesa|Display stack.
warn|vulkan-radeon|Display stack.
warn|libdrm|Display stack / KMS.
warn|kwin|Compositor. Pageflip handling on the eGPU is where these failures surface first.
warn|plasma-workspace|Session startup path that launches powerdevil.
warn|mkinitcpio|Rebuilds the initramfs; early KMS for amdgpu.
warn|systemd|Ships udev rules that interact with 81-egpu-no-runtime-pm.rules.
