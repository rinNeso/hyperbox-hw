# hyperBox hardware watchlist
# Consulted by /usr/local/bin/hw-watchlist-check (pacman PreTransaction, advisory)
# and /usr/local/bin/hw-verify (pacman PostTransaction, runs real checks).
#
# Format:  severity|package|note
#   warn   = print the note before the transaction. Nothing else.
#   verify = print the note, AND run that package's check in hw-verify afterwards.
#
# There is deliberately no "block" severity. A pacman PreTransaction hook is
# all-or-nothing: a non-zero exit aborts the ENTIRE transaction, so "block one
# package" is not a thing it can express -- on 2026-09-15 a block on limine
# stopped all 40 packages. The surgical tool is IgnorePkg in /etc/pacman.conf.
# Use that for must-never-install; use "verify" for must-check-afterwards.

# ---- upgrade lands, then something must be re-checked ----
verify|limine|Applies KERNEL_CMDLINE from /etc/default/limine, which carries the eGPU mitigations. A .pacnew here can silently drop them.
verify|cachyos-settings|Owns /usr/lib/udev/rules.d/20-audio-pm.rules, masked here by a 0-byte file in /etc/udev/rules.d. An update can reintroduce HDA runtime PM under a NEW filename, which the mask would not cover.
verify|ddcutil|3.0.0 wedged amdgpu via PowerDevil's DDC/CI probe (rockowitz/ddcutil#629, fixed in 3.0.1). Anything in [3.0.0, 3.0.1) must not stay installed.

# ---- display / eGPU blast radius: review before rebooting ----
warn|powerdevil|Loads libddcutil at session start. This is the process that takes the GPU down when ddcutil misbehaves.
warn|linux-cachyos|amdgpu and PCIe regressions land here. Keep the previous kernel installed until the eGPU is confirmed good on the new one.
warn|linux-cachyos-headers|Pairs with linux-cachyos.
warn|linux-firmware|Carries amdgpu microcode for Navi 48.
warn|linux-firmware-amdgpu|Navi 48 microcode proper.
warn|mesa|Display stack.
warn|vulkan-radeon|Display stack.
warn|libdrm|Display stack / KMS.
warn|kwin|Compositor. Pageflip handling on the eGPU is where these failures surface first.
warn|plasma-workspace|Session startup path that launches powerdevil.
warn|mkinitcpio|Rebuilds the initramfs; early KMS for amdgpu.
warn|systemd|Ships udev rules that interact with 81-egpu-no-runtime-pm.rules.
